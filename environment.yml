name: sy1-gov
channels:
  - conda-forge
  - defaults
dependencies:
  # Python
  - python=3.11

  # Core data / ML (carried from SY1)
  - numpy=1.26.4
  - pandas=2.2.2
  - scikit-learn=1.5.1
  - xgboost=2.1.1
  - torch=2.3.1
  - pytorch-geometric=2.5.3   # GraphSAGE GNN
  - networkx=3.3

  # LLM / agentic
  - pip:
    - anthropic==0.34.2          # Anthropic SDK direct (Sonnet + Haiku routing)
    - langchain==0.2.16
    - langgraph==0.2.14          # approval gate interrupt node
    - langchain-community==0.2.16

  # RAG / embeddings (carried from SY1)
  - pip:
    - faiss-cpu==1.8.0
    - sentence-transformers==3.0.1

  # API / serving (carried from SY1)
  - pip:
    - fastapi==0.112.2
    - uvicorn==0.30.6
    - streamlit==1.37.1
    - plotly==5.23.0
    - pydantic==2.8.2            # tool contracts

  # Knowledge graph / ontology (NEW in SY1-Gov)
  - pip:
    - rdflib==7.0.0              # OWL ontology + SPARQL
    - owlready2==0.46            # optional OWL reasoning

  # Evaluation (NEW in SY1-Gov)
  - pip:
    - ragas==0.1.21              # outcome quality + LLM-as-judge
    - pytest==8.3.2
    - pytest-asyncio==0.23.8
    - deepeval==0.21.73          # trajectory eval assertions

  # Observability / cost tracking (NEW in SY1-Gov)
  - pip:
    - langfuse==2.52.0           # traces, cost per agent, datasets
    - opentelemetry-sdk==1.26.0  # structured spans

  # Injection testing (NEW in SY1-Gov)
  # promptfoo is a Node.js CLI tool - installed separately:
  # npm install -g promptfoo
  # Included here as a note; not a pip package

  # Utilities
  - pip:
    - python-dotenv==1.0.1
    - httpx==0.27.0
    - tenacity==8.5.0            # retries with backoff
    - structlog==24.4.0          # structured logging
    - cryptography==43.0.1       # audit log hash-chaining
    - pytest-cov==5.0.0
