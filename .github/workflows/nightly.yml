name: Nightly - Evaluation Suite

on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC nightly
  workflow_dispatch:        # allow manual trigger

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
  LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
  PROMPTFOO_DISABLE_TELEMETRY: "1"

jobs:
  full-eval:
    name: Evaluation Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js (for promptfoo)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-ci.txt anthropic

      - name: Install promptfoo
        run: npm install -g promptfoo

      - name: Offline test suite (policy, gate, audit, trajectories)
        run: pytest tests/ -m "not live_api" -v --tb=short

      - name: LLM-as-judge live tests
        run: pytest tests/test_evals.py -m live_api -v --tb=short

      - name: Promptfoo injection suite
        run: promptfoo eval --config evals/promptfoo/injection_suite.yaml --output injection_results.json --no-cache

      - name: Injection suite pass rate
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import os

          lines = ["## Promptfoo injection suite"]
          try:
              data = json.load(open("injection_results.json"))
              res = data.get("results", data)
              stats = res.get("stats", {}) if isinstance(res, dict) else {}
              ok, bad = stats.get("successes"), stats.get("failures")
              if ok is None or bad is None:
                  lines.append("Pass rate not found in the output file; see the artifact.")
              else:
                  total = ok + bad
                  lines.append(f"{ok} of {total} cases passed ({bad} failed).")
          except FileNotFoundError:
              lines.append("No results file was produced.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines) + "\n")
          PY

      - name: Upload eval results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-${{ github.run_id }}
          path: injection_results.json
          if-no-files-found: warn
