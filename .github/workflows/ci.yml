name: CI - Smoke Tests (PR)

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
  LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}

jobs:
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Lint
        run: |
          black --check src/ tests/
          flake8 src/policy/ src/tools/ src/evals/ src/mcp/ src/tracing/ tests/ --max-line-length=100
          mypy src/policy/ src/tools/ src/evals/ src/mcp/ src/tracing/ --ignore-missing-imports --explicit-package-bases

      - name: Policy unit tests
        run: pytest tests/test_policy_engine.py tests/test_policy_contracts.py tests/test_audit.py -v --tb=short

      - name: Approval gate tests
        run: pytest tests/test_approval_gate.py -v --tb=short

      - name: Budget guard tests
        run: pytest tests/test_budget_guard.py -v --tb=short

      - name: Tracing tests
        run: pytest tests/test_tracing.py -v --tb=short

      - name: Coverage report
        run: pytest tests/ -m "not live_api" --cov=src/policy --cov=src/tools --cov=src/evals --cov=src/mcp --cov=src/tracing --cov-report=term-missing --cov-fail-under=70
