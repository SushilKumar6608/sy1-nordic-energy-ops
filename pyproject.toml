[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "sy1-nordic-energy-ops"
version = "0.1.0"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "tests*"]

[tool.pytest.ini_options]
markers = [
    "live_api: marks tests that call live LLM APIs (skipped unless ANTHROPIC_API_KEY is set)",
]
